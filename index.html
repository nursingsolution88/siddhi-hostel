<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siddhi Hostel Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { color: var(--primary-color); font-size: 24px; }
        .lang-btn { background: var(--primary-color); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 500; }
        
        .form-section, .dashboard-section { background: var(--card-bg); padding: 20px; border-radius: 12px; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { margin-bottom: 15px; font-size: 18px; color: #374151; border-bottom: 2px solid #f3f4f6; padding-bottom: 8px; }
        
        form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; align-items: flex-end; }
        .form-group label { display: block; font-size: 13px; margin-bottom: 5px; font-weight: 500; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
        form button { background: var(--success-color); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; height: 42px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e5e7eb; }
        th { background-color: #f9fafb; font-weight: 600; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; }
        .badge-due { background: #fee2e2; color: var(--danger-color); }
        .badge-ok { background: #d1fae5; color: var(--success-color); }
        
        .whatsapp-btn { background: #25D366; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
        
        .loading { text-align: center; padding: 20px; color: #6b7280; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1 id="main-title">Siddhi Hostel Management</h1>
            <p id="sub-title" style="font-size: 13px; color: #6b7280;">Total Rooms: 18 | Capacity: 54 Students</p>
        </div>
        <button class="lang-btn" onclick="toggleLanguage()">हिंदी / English</button>
    </header>

    <!-- New Student Entry Form -->
    <div class="form-section">
        <h2 id="form-heading">Add New Student / Room Entry</h2>
        <form id="studentForm" onsubmit="handleFormSubmit(event)">
            <div class="form-group">
                <label id="lbl-room">Room Number (1-18)</label>
                <select id="roomNo" required>
                    <!-- JavaScript se 1 to 18 options bhare jayenge -->
                </select>
            </div>
            <div class="form-group">
                <label id="lbl-name">Student Name</label>
                <input type="text" id="studentName" required placeholder="Rahul Kumar">
            </div>
            <div class="form-group">
                <label id="lbl-phone">Phone Number</label>
                <input type="tel" id="phone" required placeholder="9876543210">
            </div>
            <div class="form-group">
                <label id="lbl-date">Joining Date</label>
                <input type="date" id="joiningDate" required>
            </div>
            <div class="form-group">
                <label id="lbl-fee">Monthly Fee (₹)</label>
                <input type="number" id="monthlyFee" required placeholder="4500">
            </div>
            <div class="form-group">
                <label id="lbl-due">Pending Due (₹)</label>
                <input type="number" id="pendingDue" value="0">
            </div>
            <button type="submit" id="btn-save">Save Entry</button>
        </form>
    </div>

    <!-- Dashboard / Student List -->
    <div class="dashboard-section">
        <h2 id="dash-heading">Hostel Status & Fee Dues Dashboard</h2>
        <div id="loading" class="loading">Loading data from Google Sheet...</div>
        <div style="overflow-x: auto;">
            <table id="studentTable" style="display: none;">
                <thead>
                    <tr>
                        <th id="th-room">Room</th>
                        <th id="th-name">Student Name</th>
                        <th id="th-phone">Phone</th>
                        <th id="th-join">Joining Date</th>
                        <th id="th-nextdue">Next Due Date</th>
                        <th id="th-fee">Monthly Fee</th>
                        <th id="th-due">Pending Due</th>
                        <th id="th-total">Total Payable</th>
                        <th id="th-status">Status</th>
                        <th id="th-action">WhatsApp Reminder</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data yahan JavaScript se aayega -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyP8Qw7gf5-D7XKRSkzRiJvB4gKWnLv4HLxzO2t52H8VMzvDN9LeA7zx4qvfK0I-1kT/exec";
    const ADMIN_WHATSAPP = "8851971281";
    let currentLang = 'en';

    // Room Dropdown populate karein (1 to 18)
    const roomSelect = document.getElementById('roomNo');
    for(let i=1; i<=18; i++) {
        let opt = document.createElement('option');
        opt.value = i;
        opt.innerHTML = `Room ${i}`;
        roomSelect.appendChild(opt);
    }

    // Page load hone par data fetch karein
    window.onload = function() {
        fetchData();
    };

    function fetchData() {
        fetch(SCRIPT_URL)
            .then(response => response.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('studentTable').style.display = 'table';
                renderTable(data);
            })
            .catch(error => {
                document.getElementById('loading').innerHTML = 'Error loading data. Please check Apps Script deployment.';
                console.error('Error:', error);
            });
    }

    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        data.forEach(row => {
            let tr = document.createElement('tr');
            
            // Date calculation logic (Joining date ke hisaab se agla mahina nikalna)
            let joinDateObj = new Date(row.JoiningDate);
            let today = new Date();
            
            // Next due date logic: Joining date ki day har mahine aayegi
            let nextDueDate = new Date(today.getFullYear(), today.getMonth(), joinDateObj.getDate());
            if (today > nextDueDate) {
                // Agar is mahine ki due date nikal chuki hai, toh agle mahine ki dikhao
                nextDueDate.setMonth(nextDueDate.getMonth() + 1);
            }

            let formattedDueDate = nextDueDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
            
            let monthlyFee = Number(row.MonthlyFee) || 0;
            let pendingDue = Number(row.PendingDue) || 0;
            let totalPayable = monthlyFee + pendingDue;

            // Check if due date is today or passed
            let isDue = today >= nextDueDate;
            let statusBadge = isDue ? 
                `<span class="badge badge-due">${currentLang === 'hi' ? 'ड्यू (Due)' : 'Due'}</span>` : 
                `<span class="badge badge-ok">${currentLang === 'hi' ? 'Paid / सुरक्षित' : 'Active'}</span>`;

            // WhatsApp Message Text
            let waMessage = `Siddhi Hostel Fee Reminder%0AStudent Name: ${row.StudentName}%0ARoom Number: ${row.RoomNo}%0AMonth Complete Date: ${formattedDueDate}%0AMonthly Fee: ₹${monthlyFee}%0APrevious Due: ₹${pendingDue}%0ATotal Payment लेना है: ₹${totalPayable}`;
            let waLink = `https://wa.me/91${ADMIN_WHATSAPP}?text=${waMessage}`;

            tr.innerHTML = `
                <td><b>Room ${row.RoomNo}</b></td>
                <td>${row.StudentName}</td>
                <td>${row.Phone}</td>
                <td>${row.JoiningDate}</td>
                <td><b>${formattedDueDate}</b></td>
                <td>₹${monthlyFee}</td>
                <td>₹${pendingDue}</td>
                <td><b>₹${totalPayable}</b></td>
                <td>${statusBadge}</td>
                <td><a href="${waLink}" target="_blank" class="whatsapp-btn">💬 Send WhatsApp</a></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function handleFormSubmit(e) {
        e.preventDefault();
        
        let formData = {
            RoomNo: document.getElementById('roomNo').value,
            StudentName: document.getElementById('studentName').value,
            Phone: document.getElementById('phone').value,
            JoiningDate: document.getElementById('joiningDate').value,
            MonthlyFee: document.getElementById('monthlyFee').value,
            PendingDue: document.getElementById('pendingDue').value || 0
        };

        document.getElementById('btn-save').innerText = currentLang === 'hi' ? 'Saving...' : 'Saving...';

        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(formData)
        })
        .then(response => response.json())
        .then(result => {
            alert(currentLang === 'hi' ? 'Data successfully save ho gaya!' : 'Data saved successfully!');
            document.getElementById('studentForm').reset();
            document.getElementById('btn-save').innerText = currentLang === 'hi' ? 'Save Entry' : 'Save Entry';
            fetchData(); // Table refresh karein
        })
        .catch(error => {
            alert('Error saving data!');
            console.error('Error:', error);
            document.getElementById('btn-save').innerText = 'Save Entry';
        });
    }

    // Language Toggle Function
    function toggleLanguage() {
        if(currentLang === 'en') {
            currentLang = 'hi';
            document.getElementById('main-title').innerText = 'सिद्धि हॉस्टल मैनेजमेंट';
            document.getElementById('sub-title').innerText = 'कुल कमरे: 18 | क्षमता: 54 छात्र';
            document.getElementById('form-heading').innerText = 'नया छात्र / कमरा जोड़े';
            document.getElementById('lbl-room').innerText = 'कमरा नंबर (1-18)';
            document.getElementById('lbl-name').innerText = 'छात्र का नाम';
            document.getElementById('lbl-phone').innerText = 'मोबाइल नंबर';
            document.getElementById('lbl-date').innerText = 'हॉस्टल जॉइनिंग तिथि';
            document.getElementById('lbl-fee').innerText = 'मासिक फीस (₹)';
            document.getElementById('lbl-due').innerText = 'पिछला बकाया (₹)';
            document.getElementById('btn-save').innerText = 'डेटा सेव करें';
            document.getElementById('dash-heading').innerText = 'हॉस्टल स्टेटस और फीस ड्यू डैशबोर्ड';
            // Table headers
            document.getElementById('th-room').innerText = 'कमरा';
            document.getElementById('th-name').innerText = 'नाम';
            document.getElementById('th-phone').innerText = 'फ़ोन';
            document.getElementById('th-join').innerText = 'जॉइनिंग तिथि';
            document.getElementById('th-nextdue').innerText = 'अगली ड्यू तिथि';
            document.getElementById('th-fee').innerText = 'मासिक फीस';
            document.getElementById('th-due').innerText = 'बकाया';
            document.getElementById('th-total').innerText = 'कुल राशि';
            document.getElementById('th-status').innerText = 'स्थिति';
            document.getElementById('th-action').innerText = 'व्हाट्सएप रिमाइंडर';
        } else {
            currentLang = 'en';
            location.reload(); // Simple reload to revert back to English
        }
    }
</script>

</body>
</html>
